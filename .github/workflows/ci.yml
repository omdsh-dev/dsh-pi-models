name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install peer for pack resolution (best-effort)
        run: pnpm install --ignore-scripts || true
      - name: Dry-run pack and assert manifest files exist
        run: |
          pnpm pack --dry-run --json > pack.json
          node -e '
            const fs = require("fs");
            const parsed = JSON.parse(fs.readFileSync("pack.json", "utf8"));
            // pnpm --dry-run --json may emit an array, an object, or trailing warnings.
            const obj = Array.isArray(parsed) ? parsed[0] : parsed;
            const name = obj.name, version = obj.version;
            let files = obj.files;
            const names = Array.isArray(files) ? files.map(f => f.path) : Object.keys(files || {});
            const required = ["index.js", "cordis.patch.yml", "icon.svg", "README.md", "LICENSE", "locale/en.json", "locale/zh.json",
              "src/bridge.js", "src/convert.js", "src/catalog.js", "src/project.js"];
            const missing = required.filter(r => !names.includes(r));
            if (missing.length) { console.error("missing from pack:", missing); process.exit(1); }
            console.log(`ok: ${name}@${version} packs ${names.length} files`);
          '

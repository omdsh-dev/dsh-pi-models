name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install (legacy peer resolution for the @deepseek-ai closure)
        run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
      - name: Host entry import check
        run: node -e "import('./lib/index.js').then(m=>console.log('exports:',Object.keys(m).length))"
      - name: Dry-run pack and assert manifest files exist
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const fs = require("fs");
            const parsed = JSON.parse(fs.readFileSync("pack.json", "utf8"));
            // npm --dry-run --json may emit an array, an object, or trailing warnings.
            const obj = Array.isArray(parsed) ? parsed[0] : parsed;
            const name = obj.name, version = obj.version;
            let files = obj.files;
            const names = Array.isArray(files) ? files.map(f => f.path) : Object.keys(files || {});
            const required = ["lib/index.js", "lib/bridge.js", "lib/convert.js", "lib/catalog.js", "lib/project.js",
              "cordis.patch.yml", "icon.svg", "README.md", "LICENSE", "locale/en.json", "locale/zh.json"];
            const missing = required.filter(r => !names.includes(r));
            if (missing.length) { console.error("missing from pack:", missing); process.exit(1); }
            console.log(`ok: ${name}@${version} packs ${names.length} files`);
          '
